name: Deploy Frontend

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Update Frontend Source
        run: |
          cd /opt/opspilot/frontend-src

          git fetch origin
          git reset --hard origin/develop

      - name: Rebuild Frontend Container
        run: |
          cd /opt/opspilot

          docker compose build frontend

          docker compose up -d frontend
